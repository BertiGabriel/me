<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Augusto Galego</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top, rgba(56, 189, 248, 0.16), transparent 28%),
                radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.08), transparent 20%),
                #050816;
            color: #f8fafc;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        a {
            color: inherit;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const courseHighlights = [
            {
                title: "Estruturas de Dados e Algoritmos + LeetCode",
                description:
                    "Curso completo com 68 aulas, explicações visuais e desenhos na tela para dominar os fundamentos exigidos em entrevistas técnicas.",
                cta: "Assista a primeira aula grátis",
                href: "https://pay.hub.la/L8wi9vio7WPnWbmF8ZIO?coupon=SITEGALEGO",
            },
            {
                title: "Roadmap pro seu próximo emprego",
                description:
                    "Tudo o que você precisa saber para encontrar vagas no Brasil e no exterior, melhorar o LinkedIn e ser aprovado em entrevistas.",
                cta: "Saiba mais",
                href: "https://pay.hub.la/hrZKmxeXzeLN8AvObjVJ?coupon=SITEGALEGO",
            },
            {
                title: "Workshop: 10 LeetCodes para Entrevistas",
                description:
                    "Aprenda a resolver os 10 problemas mais cobrados em entrevistas técnicas com explicações detalhadas e estratégias de resolução.",
                cta: "Saiba mais",
                href: "https://pay.hub.la/RGfq0dk8iqDeL5IC5yog?coupon=SITEGALEGO2",
            },
            {
                title: "Workshop: System Design para Entrevistas",
                description:
                    "Domine os fundamentos de System Design e aprenda a projetar sistemas escaláveis para grandes empresas.",
                cta: "Saiba mais",
                href: "https://pay.hub.la/ASHOugkp5yQfI4pdLNHx?coupon=SITEGALEGO",
            },
        ];

        const blogPosts = [
            {
                title: "Começar Te Dá o Framework Para Pensar em Como Começar",
                description:
                    "Por que você precisa começar antes de pedir conselhos, e como experiência gera conversas significativas.",
                meta: "5 min de leitura",
                href: "https://www.augustogalego.com/blog/starting-things",
            },
            {
                title: "Notação Big O",
                description:
                    "Guia completo para entender complexidade de tempo, espaço e como analisar algoritmos com segurança.",
                meta: "8 min de leitura",
                href: "https://www.augustogalego.com/blog/big-o",
            },
            {
                title: "Balanceadores de Carga",
                description:
                    "Um guia sobre balanceadores de carga, algoritmos e como eles garantem escalabilidade em sistemas distribuídos.",
                meta: "7 min de leitura",
                href: "https://www.augustogalego.com/blog/load-balancer",
            },
        ];

        const channels = [
            {
                title: "@GutoGalego",
                description: "Canal principal com foco em algoritmos, LeetCode e carreira em tech.",
                badge: "131K+ Inscritos",
                href: "https://www.youtube.com/@GutoGalego",
            },
            {
                title: "@GutoMonólogos",
                description: "Canal secundário com monólogos, reflexões pessoais e dicas de produtividade.",
                badge: "Crescendo",
                href: "https://www.youtube.com/@GutoMonologos",
            },
        ];

        function Card({ title, description, action, href, badge, meta }) {
            return (
                <article className="rounded-[32px] border border-white/10 bg-slate-950/80 p-8 shadow-[0_40px_120px_-70px_rgba(56,189,248,0.65)] transition hover:-translate-y-1">
                    <div className="space-y-4">
                        <h3 className="text-xl font-semibold">{title}</h3>
                        <p className="text-slate-300">{description}</p>
                    </div>
                    <div className="mt-8 flex items-center justify-between gap-3">
                        <a href={href} className="text-sky-300 font-semibold hover:text-white">
                            {action || "Abrir"}
                        </a>
                        <span className="rounded-full bg-sky-500/10 px-3 py-1 text-sm text-sky-200">{badge || meta || ""}</span>
                    </div>
                </article>
            );
        }

        function App() {
            return (
                <div className="min-h-screen px-6 py-8 md:px-10 lg:px-16">
                    <header className="mx-auto max-w-7xl">
                        <div className="flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
                            <span className="text-xs font-semibold uppercase tracking-[0.3em] text-sky-300">Augusto Galego</span>
                            <nav className="flex flex-wrap gap-4 text-sm text-slate-200">
                                <a href="#courses" className="hover:text-white">Cursos</a>
                                <a href="#articles" className="hover:text-white">Artigos</a>
                                <a href="#channels" className="hover:text-white">Canais</a>
                                <a href="#newsletter" className="hover:text-white">Newsletter</a>
                            </nav>
                        </div>
                    </header>

                    <section className="mx-auto mt-16 max-w-6xl">
                        <div className="grid gap-12 lg:grid-cols-[1.2fr_0.8fr] lg:items-end">
                            <div className="space-y-8">
                                <p className="max-w-xl rounded-full bg-sky-500/10 px-4 py-2 text-sm font-semibold uppercase tracking-[0.3em] text-sky-200">
                                    Aprenda com quem chegou lá
                                </p>
                                <h1 className="max-w-3xl text-5xl font-semibold leading-tight tracking-[-0.04em] text-white md:text-6xl">
                                    Conteúdo prático para dominar algoritmos, entrevistas e carreira em tech.
                                </h1>
                                <p className="max-w-2xl text-lg text-slate-300">
                                    Cursos, workshops e artigos inspirados no estilo de ensino que combina explicações visuais, estudo de casos e foco em resultados reais.
                                </p>
                                <div className="flex flex-col gap-4 sm:flex-row">
                                    <a href="https://pay.hub.la/L8wi9vio7WPnWbmF8ZIO?coupon=SITEGALEGO" className="inline-flex items-center justify-center rounded-full bg-sky-400 px-6 py-3 text-sm font-semibold text-slate-950 transition hover:bg-sky-300">
                                        Ver curso principal
                                    </a>
                                    <a href="https://www.youtube.com/@GutoGalego" className="inline-flex items-center justify-center rounded-full border border-white/10 bg-white/5 px-6 py-3 text-sm font-semibold text-slate-100 transition hover:border-sky-300 hover:bg-slate-800">
                                        Assistir YouTube
                                    </a>
                                </div>
                            </div>

                            <div className="grid gap-5 rounded-[32px] border border-white/10 bg-white/5 p-8 shadow-2xl shadow-slate-950/40">
                                <div className="rounded-[28px] bg-slate-950/70 p-6">
                                    <p className="text-sm uppercase tracking-[0.3em] text-sky-300">Destaques</p>
                                    <div className="mt-6 grid gap-4 text-left text-slate-200 sm:grid-cols-2">
                                        <div className="rounded-3xl bg-slate-900/90 p-5">
                                            <p className="text-3xl font-semibold">131K+</p>
                                            <p className="text-sm text-slate-400">Inscritos YouTube</p>
                                        </div>
                                        <div className="rounded-3xl bg-slate-900/90 p-5">
                                            <p className="text-3xl font-semibold">68</p>
                                            <p className="text-sm text-slate-400">Aulas no curso</p>
                                        </div>
                                        <div className="rounded-3xl bg-slate-900/90 p-5">
                                            <p className="text-3xl font-semibold">10+</p>
                                            <p className="text-sm text-slate-400">Anos de experiência</p>
                                        </div>
                                        <div className="rounded-3xl bg-slate-900/90 p-5">
                                            <p className="text-3xl font-semibold">3</p>
                                            <p className="text-sm text-slate-400">Países trabalhados</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="courses" className="mx-auto mt-24 max-w-6xl">
                        <div className="space-y-5">
                            <p className="text-sm font-semibold uppercase tracking-[0.3em] text-sky-300">Cursos e workshops</p>
                            <h2 className="text-4xl font-semibold text-white">Aprenda com quem chegou lá</h2>
                        </div>
                        <div className="mt-10 grid gap-6 md:grid-cols-2">
                            {courseHighlights.map((item) => (
                                <Card key={item.title} title={item.title} description={item.description} action={item.cta} href={item.href} />
                            ))}
                        </div>
                    </section>

                    <section id="articles" className="mx-auto mt-24 max-w-6xl">
                        <div className="space-y-5">
                            <p className="text-sm font-semibold uppercase tracking-[0.3em] text-sky-300">Artigos populares</p>
                            <h2 className="text-4xl font-semibold text-white">Conteúdo profundo para revisar conceitos e ampliar seu raciocínio técnico.</h2>
                        </div>
                        <div className="mt-10 grid gap-6 md:grid-cols-3">
                            {blogPosts.map((item) => (
                                <Card key={item.title} title={item.title} description={item.description} href={item.href} meta={item.meta} />
                            ))}
                        </div>
                    </section>

                    <section id="channels" className="mx-auto mt-24 max-w-6xl">
                        <div className="space-y-5">
                            <p className="text-sm font-semibold uppercase tracking-[0.3em] text-sky-300">Dois canais, uma missão</p>
                            <h2 className="text-4xl font-semibold text-white">Conteúdo técnico no canal principal e reflexões no canal secundário.</h2>
                        </div>
                        <div className="mt-10 grid gap-6 md:grid-cols-2">
                            {channels.map((channel) => (
                                <Card key={channel.title} title={channel.title} description={channel.description} href={channel.href} badge={channel.badge} />
                            ))}
                        </div>
                    </section>

                    <section id="newsletter" className="mx-auto mt-24 max-w-6xl rounded-[32px] border border-white/10 bg-slate-950/80 p-10">
                        <div className="grid gap-8 lg:grid-cols-[1.1fr_0.9fr] lg:items-center">
                            <div className="space-y-4">
                                <p className="text-sm font-semibold uppercase tracking-[0.3em] text-sky-300">Receba insights direto na sua caixa</p>
                                <h2 className="text-4xl font-semibold text-white">Junte-se a +2000 devs e receba conteúdo exclusivo toda semana.</h2>
                                <p className="max-w-2xl text-slate-300">
                                    Emails semanais com dicas de algoritmos, carreira internacional, system design e produtividade.
                                </p>
                            </div>
                            <form className="grid gap-4 sm:grid-cols-[1fr_auto]">
                                <input type="email" placeholder="Seu melhor e-mail" className="w-full rounded-2xl border border-white/10 bg-slate-900/90 px-5 py-4 text-slate-100 outline-none transition focus:border-sky-300" />
                                <button type="submit" className="inline-flex items-center justify-center rounded-2xl bg-sky-400 px-6 py-4 text-sm font-semibold text-slate-950 transition hover:bg-sky-300">
                                    Quero Receber Insights
                                </button>
                            </form>
                        </div>
                    </section>

                    <footer className="mx-auto mt-24 max-w-6xl border-t border-white/10 pt-10 text-slate-400">
                        <div className="grid gap-10 md:grid-cols-4">
                            <div>
                                <p className="text-sm uppercase tracking-[0.3em] text-sky-300">Augusto Galego</p>
                                <p className="mt-4 text-slate-300">Conteúdo técnico para quem quer crescer em entrevistas, carreira e engenharia de software.</p>
                            </div>
                            <div className="space-y-3">
                                <p className="text-sm uppercase tracking-[0.3em] text-slate-300">Links</p>
                                <a href="https://www.augustogalego.com/blog" className="block hover:text-white">Blog</a>
                                <a href="https://www.augustogalego.com/about" className="block hover:text-white">Sobre</a>
                                <a href="https://www.augustogalego.com/contact" className="block hover:text-white">Contato</a>
                            </div>
                            <div className="space-y-3">
                                <p className="text-sm uppercase tracking-[0.3em] text-slate-300">Aprendizado</p>
                                <a href="https://www.augustogalego.com/courses" className="block hover:text-white">Cursos</a>
                                <a href="https://www.augustogalego.com/blog?category=Algoritmos" className="block hover:text-white">Algoritmos</a>
                                <a href="https://www.augustogalego.com/blog?category=System%20Design" className="block hover:text-white">System Design</a>
                            </div>
                            <div className="space-y-3">
                                <p className="text-sm uppercase tracking-[0.3em] text-slate-300">Comunidade</p>
                                <a href="https://www.youtube.com/@GutoGalego" className="block hover:text-white">YouTube</a>
                                <a href="https://github.com/gutogalego" className="block hover:text-white">GitHub</a>
                                <a href="https://www.linkedin.com/in/augusto-galego-60a0b1160/" className="block hover:text-white">LinkedIn</a>
                            </div>
                        </div>
                        <p className="mt-10 text-sm text-slate-500">© 2026 Augusto Galego. Todos os direitos reservados.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>

</html>
